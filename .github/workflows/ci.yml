name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install SQLite on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Require SQLite integration prerequisite
        run: sqlite3 --version
      - name: Test and vet
        run: |
          go test -race -coverprofile=coverage.out ./...
          go vet ./...
          go tool cover -func=coverage.out
          bash -n scripts/install.sh
      - name: Cross-build supported platforms
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "$RUNNER_TEMP/bakctl-$os-$arch" ./cmd/bakctl
            done
          done
