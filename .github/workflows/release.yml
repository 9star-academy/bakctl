name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Tests
        run: go test -v ./...

      - name: Build Matrix Binaries
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF#refs/tags/}"
          LDFLAGS="-s -w -X main.version=${TAG}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/bakctl-linux-amd64 ./cmd/bakctl
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/bakctl-linux-arm64 ./cmd/bakctl
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/bakctl-darwin-amd64 ./cmd/bakctl
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/bakctl-darwin-arm64 ./cmd/bakctl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bakctl-linux-amd64
            dist/bakctl-linux-arm64
            dist/bakctl-darwin-amd64
            dist/bakctl-darwin-arm64
          generate_release_notes: true
